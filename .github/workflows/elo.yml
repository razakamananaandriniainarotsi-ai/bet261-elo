name: Elo Auto Update

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install requests
      - name: Fetch Elo
        run: python fetch_elo.py
      - name: Commit
        run: |
          git config user.name "bet261-bot"
          git config user.email "bot@bet261.mg"
          git add elo.json || echo "no elo.json"
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Update Elo $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
