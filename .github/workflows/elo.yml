name: Elo Auto Update On Change

on:
  schedule:
    - cron: '0 * * * *'  # Toutes les heures, 24/24 - dès que source change, MAJ dans l'heure
  workflow_dispatch:  # Permet de lancer manuellement depuis l'interface Github

permissions:
  contents: write  # Permet de push elo.json

jobs:
  update-elo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install deps
        run: pip install requests beautifulsoup4
        
      - name: Fetch Elo sources (ClubElo + FootballDatabase + Eloratings)
        run: |
          python fetch_elo.py
          
      - name: Check if elo.json changed
        id: check
        run: |
          if [ ! -f elo.json ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git diff --quiet elo.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Aucun changement - sources identiques"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Elo a changé - MAJ nécessaire"
            git diff --stat elo.json
          fi
          
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --global user.name "Bet261 Elo Bot"
          git config --global user.email "bot@bet261.mg"
          git add elo.json
          git commit -m "Auto-update Elo $(date -u +%Y-%m-%dT%H:%M:%SZ) - source changed [skip ci]" || echo "Nothing to commit"
          git push
          echo "✅ elo.json poussé - Bet261 aura la MAJ à la prochaine ouverture"
          
      - name: No change
        if: steps.check.outputs.changed == 'false'
        run: echo "Pas de MAJ - Elo identique"
